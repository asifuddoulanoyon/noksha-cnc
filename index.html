<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1c11">
<title>নকশা CNC</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee5;--card:#fffaf3;--ink:#2a1c11;--mut:#7b6655;--acc:#9a4c18;--acc2:#d08a3c;--line:#e6d7c2;--soft:#f7e9d6;--warn:#a8471a;--ok:#2d7a4c;--bar:#2a1c11;--top:calc(56px + env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
header.bar{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--top);padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;background:var(--bar);color:#fbead2;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ib{border:0;background:transparent;color:inherit;font-size:22px;width:42px;height:42px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:active{background:rgba(255,255,255,.12)}
.ttl{flex:1;min-width:0;line-height:1.2}.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{font-size:12.5px;opacity:.75}
.unitb{border:1px solid #6b4e36;background:#3d2a1b;color:#fbead2;border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.prog{position:fixed;top:var(--top);left:0;right:0;height:4px;background:#e2d2bb;z-index:29}.prog i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.wrap{max-width:760px;margin:0 auto;padding:calc(var(--top) + 10px) 12px calc(96px + env(safe-area-inset-bottom))}
.pvpane{position:sticky;top:calc(var(--top) + 6px);z-index:20;margin-bottom:10px}
.pvbox{position:relative;background:linear-gradient(#efe6da,#ddd2c3);border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:center;height:34vh;min-height:190px;box-shadow:0 6px 18px rgba(60,35,10,.15);border:1px solid var(--line);perspective:900px}
.pvbox.paper{background:#fff}
.pvbox canvas{max-width:100%;max-height:100%;display:block;transition:transform .35s}
.pvbox canvas.tilt{transform:rotateX(36deg) rotateZ(-6deg) scale(.82);filter:drop-shadow(0 22px 18px rgba(0,0,0,.35))}
.pvtools{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pvtools>*{pointer-events:auto}
.seg{display:flex;background:rgba(255,250,243,.92);border-radius:12px;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.pvfull{border:0;background:rgba(255,250,243,.92);border-radius:12px;width:36px;height:34px;font-size:18px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pvdim{position:absolute;top:6px;left:8px;font-size:12px;font-weight:600;background:rgba(255,250,243,.88);padding:1px 8px;border-radius:10px;color:var(--ink)}
.pvbusy{position:absolute;top:6px;right:8px;font-size:12px;color:var(--mut)}
.warnline{margin-top:6px;background:#fbe6d6;color:#7d3410;border-radius:10px;padding:6px 10px;font-size:13px}
h2{font-size:19px;margin:4px 0 4px;color:var(--acc)}
h3{font-size:15.5px;margin:16px 0 8px}
.lead{color:var(--mut);font-size:14px;margin:0 0 10px}
.tip{background:var(--soft);border-left:4px solid var(--acc2);padding:8px 10px;border-radius:10px;font-size:13.5px;margin:8px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:600px){.grid3{grid-template-columns:repeat(4,1fr)}}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--acc);background:#fff3e3;box-shadow:0 0 0 3px rgba(154,76,24,.15)}
.opt .th{height:120px;border-radius:10px;background:linear-gradient(#efe6da,#ddd2c3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.opt .th canvas{max-width:100%;max-height:100%;display:block}
.opt .th .ld{font-size:12px;color:var(--mut)}
.opt b{font-size:13.5px;line-height:1.25}.opt small{font-size:11.5px;color:var(--mut);line-height:1.25}
.opt.big .th{height:210px}
.opt .chk{position:absolute;top:6px;right:6px;background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;display:none;align-items:center;justify-content:center}
.opt.on .chk{display:flex}
.fur{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 6px;cursor:pointer;text-align:center;font-weight:600;font-size:14px}
.fur svg{width:64px;height:64px;display:block;margin:0 auto 4px}
.fur.on{border-color:var(--acc);background:#fff3e3}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.sug{border-style:dashed;border-color:var(--acc2)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--mut)}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font-size:17px;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--acc2)}
.fld.bigin input{font-size:22px;font-weight:600;text-align:center}
.rng{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--mut);margin:6px 0}
.rng input{width:100%;accent-color:var(--acc)}
.rng .v{color:var(--ink);font-weight:600}
.tog{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:15px;margin:6px 0}
.tog input{width:22px;height:22px;accent-color:var(--acc)}
details.more{margin-top:10px;border:1px dashed var(--acc2);border-radius:12px;padding:0 10px;background:#fffaf3}
details.more summary{padding:9px 0;font-weight:600;color:var(--acc);cursor:pointer}
details.more .grid2{padding-bottom:10px}
footer.act{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(244,238,229,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
footer.act .btn{flex:1}
.btn{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer}
.btn.sec{background:#fff;color:var(--acc);border:1.5px solid var(--acc);flex:0 0 auto!important}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.home-hero{border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#3a2616,#6b3f1d);color:#fbead2;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:14px}
.home-hero canvas{width:92px;height:auto;border-radius:10px;flex:0 0 auto}
.home-hero h1{margin:0;font-size:22px}.home-hero p{margin:4px 0 0;font-size:13.5px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:18px;padding:16px 12px;text-align:left;cursor:pointer;background:#fff;box-shadow:0 3px 12px rgba(60,35,10,.1);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:132px}
.tile .em{font-size:32px}.tile b{font-size:17px}.tile small{color:var(--mut);font-size:12.5px;line-height:1.35}
.tile.main{background:linear-gradient(160deg,#fff7ec,#f6e2c6)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.slim{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:600;cursor:pointer;text-align:left}
.list{display:flex;flex-direction:column;gap:8px}
.fileitem{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.fileitem .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.fileitem .i{flex:1;min-width:0}.fileitem .i b{display:block;font-size:14.5px}.fileitem .i small{color:var(--mut);font-size:12.5px}
.mini{font-size:12.5px;color:var(--mut)}
.warn{background:#fbe6d6;color:#7d3410;border-radius:10px;padding:7px 10px;font-size:13.5px;margin:5px 0}
.okm{background:#e3f1e6;color:#1f5a36;border-radius:10px;padding:7px 10px;font-size:13.5px;margin:5px 0}
.tipm{background:#f6efe4;border-radius:10px;padding:7px 10px;font-size:13.5px;margin:5px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
table.t th{background:#f3e7d6}
.scroll{overflow-x:auto}
pre.code{background:#1f1813;color:#f3dfc2;padding:10px;border-radius:12px;max-height:260px;overflow:auto;font-size:11.5px}
.drop{border:2px dashed var(--acc2);border-radius:16px;padding:22px 12px;text-align:center;background:#fffaf3;cursor:pointer;font-weight:600}
.drop img{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:block;margin-left:auto;margin-right:auto}
.help details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.help summary{padding:12px;font-weight:700;cursor:pointer;color:var(--acc)}
.help .in{padding:0 14px 12px;font-size:14.5px}
.help li{margin-bottom:5px}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.guide button.on{border-color:var(--acc);background:#fff3e3}
.viewer{position:fixed;inset:0;z-index:60;background:#1c1510;display:flex;flex-direction:column}
.viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;color:#fbead2}
.viewer .vc{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;perspective:1200px}
.viewer .vc.paper{background:#fff}
.viewer canvas{max-width:100%;max-height:100%;transition:transform .35s}
.viewer canvas.zoom{max-width:none;max-height:none;width:200%}
.viewer canvas.tilt{transform:rotateX(36deg) rotateZ(-6deg) scale(.85)}
.legend{font-size:11.5px;color:var(--mut);margin-top:5px;line-height:1.9}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1c11;color:#fbead2;padding:10px 16px;border-radius:14px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.stepname{display:flex;align-items:baseline;gap:8px}.stepname .no{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="backB" aria-label="পিছনে">←</button>
  <div class="ttl"><b id="ttl">নকশা CNC</b><small id="sub">ফার্নিচারের নকশা থেকে CNC ফাইল</small></div>
  <button class="unitb" id="unitB">ইঞ্চি</button>
</header>
<div class="prog hidden" id="prog"><i id="progI"></i></div>
<div class="wrap">
  <div class="pvpane hidden" id="pvPane">
    <div class="pvbox" id="pvBox">
      <canvas id="pv" width="10" height="10"></canvas>
      <div class="pvdim" id="pvDim"></div><div class="pvbusy" id="pvBusy"></div>
      <div class="pvtools">
        <div class="seg" id="pvSeg"><button data-v="shade" class="on">3D</button><button data-v="draw">2D মাপ</button><button data-v="tilt">হেলানো</button><button data-v="path">টুলপাথ</button></div>
        <button class="pvfull" id="pvFull" title="বড় করে দেখো">⤢</button>
      </div>
    </div>
    <div class="legend hidden" id="pvLegend"><i style="background:#1d4fa3"></i>লাইন (V-বিট)<i style="background:#e08a1c"></i>রিলিফ<i style="background:#1f8a4c"></i>জালি<i style="background:#d0281c"></i>কাটিং<i style="background:#f0a020"></i>ট্যাব<i style="background:#7a2ea0"></i>ছিদ্র</div>
    <div class="warnline hidden" id="warnLine"></div>
  </div>
  <main id="main"></main>
</div>
<footer class="act hidden" id="act"><button class="btn sec" id="prevB">← আগের</button><button class="btn" id="nextB">পরের ধাপ →</button></footer>
<div class="viewer hidden" id="viewer">
  <div class="vt"><button class="ib" id="vClose">✕</button><div class="seg" id="vSeg"><button data-v="shade" class="on">3D</button><button data-v="draw">2D মাপ</button><button data-v="tilt">হেলানো</button><button data-v="path">টুলপাথ</button></div><button class="ib" id="vZoom" title="জুম">🔍</button></div>
  <div class="vc" id="vc"><canvas id="vcv"></canvas></div>
</div>
<input type="file" accept="image/*" id="fileIn" class="hidden">
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ===================== GEOMETRY / ENGINE ===================== */
function topY(p,x){const W=p.W,H=p.H,a=Math.min(Math.max(0,p.archH),H*0.9),xc=Math.min(1,Math.abs(x-W/2)/(W/2));
 switch(p.top){
  case 'arch':return H-a+a*Math.sqrt(Math.max(0,1-xc*xc));
  case 'carch':{const hw=0.34;return xc<hw?H-a+a*Math.sqrt(Math.max(0,1-(xc/hw)**2)):H-a;}
  case 'wave':{const k=Math.max(1,Math.round(p.waves||5));return H-a+a*Math.pow(Math.abs(Math.sin(Math.PI*k*x/W)),0.6);}
  case 'crown':{let g;if(xc<0.18)g=0.35*(1-Math.cos(Math.PI*xc/0.18))/2;else if(xc<0.3)g=0.35;else if(xc<0.42)g=0.35+0.3*(1-Math.cos(Math.PI*(xc-0.3)/0.12))/2;else if(xc<0.82)g=0.65;else g=0.65+0.35*(1-Math.cos(Math.PI*(xc-0.82)/0.18))/2;return H-a*g;}
  case 'gable':return H-a*xc;
  case 'step':return H-a*(xc<0.34?0:xc<0.67?0.5:1);
  default:return H;}}
function botY(p,x){const W=p.W,b=Math.min(Math.max(0,p.bArchH),p.H*0.5);
 switch(p.bottom){
  case 'arch':{const hw=0.4*W,d=(x-W/2)/hw;return Math.abs(d)<1?b*Math.sqrt(1-d*d):0;}
  case 'scallop':return b*Math.pow(Math.abs(Math.sin(Math.PI*3*x/W)),0.7);
  default:return 0;}}
function cornerOK(p,x,y){const r=p.radius;if(r<=0)return true;const W=p.W,H=p.H;
 if(p.bottom==='flat'){if(x<r&&y<r&&Math.hypot(x-r,y-r)>r)return false;if(x>W-r&&y<r&&Math.hypot(x-W+r,y-r)>r)return false;}
 if(p.top==='flat'){if(x<r&&y>H-r&&Math.hypot(x-r,y-H+r)>r)return false;if(x>W-r&&y>H-r&&Math.hypot(x-W+r,y-H+r)>r)return false;}
 return true;}
function makeGrid(W,H,res,M){const gw=Math.ceil((W+2*M)/res),gh=Math.ceil((H+2*M)/res);
 return {gw,gh,res,M,W,H,X:i=>(i+0.5)*res-M,Y:j=>H+M-(j+0.5)*res,I:x=>(x+M)/res-0.5,J:y=>(H+M-y)/res-0.5};}

const BIG=1e20;
function dt1d(f,n,d,v,z){let k=0;v[0]=0;z[0]=-Infinity;z[1]=Infinity;
 for(let q=1;q<n;q++){let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
  while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);}
  k++;v[k]=q;z[k]=s;z[k+1]=Infinity;}
 k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const t=q-v[k];d[q]=t*t+f[v[k]];}}
function sqdt(mask,w,h,target){const g=new Float64Array(w*h);for(let i=0;i<w*h;i++)g[i]=mask[i]===target?0:BIG;
 const n=Math.max(w,h),f=new Float64Array(n),d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);
 for(let x=0;x<w;x++){for(let y=0;y<h;y++)f[y]=g[y*w+x];dt1d(f,h,d,v,z);for(let y=0;y<h;y++)g[y*w+x]=d[y];}
 for(let y=0;y<h;y++){const o=y*w;for(let x=0;x<w;x++)f[x]=g[o+x];dt1d(f,w,d,v,z);for(let x=0;x<w;x++)g[o+x]=d[x];}
 return g;}
function signedDist(mask,w,h){const a=sqdt(mask,w,h,0),b=sqdt(mask,w,h,1),S=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)S[i]=mask[i]?Math.sqrt(a[i])-0.5:-(Math.sqrt(b[i])-0.5);return S;}

// marching squares with interpolation; returns loops of [i,j] (pixel-centre grid coords)
function contours(F,w,h,lev){
 const sa=[];const pts=new Map();
 const ep=k=>{if(pts.has(k))return;const idx=k>>1,x=idx%w,y=(idx-x)/w;
  if(k&1){const a=F[y*w+x],b=F[(y+1)*w+x];pts.set(k,[x,y+(lev-a)/(b-a)]);}
  else{const a=F[y*w+x],b=F[y*w+x+1];pts.set(k,[x+(lev-a)/(b-a),y]);}};
 const seg=(a,b)=>{ep(a);ep(b);sa.push(a,b);};
 for(let y=0;y<h-1;y++){const o=y*w,o2=o+w;for(let x=0;x<w-1;x++){
  const tl=F[o+x]>lev,tr=F[o+x+1]>lev,br=F[o2+x+1]>lev,bl=F[o2+x]>lev;
  const c=(tl?8:0)|(tr?4:0)|(br?2:0)|(bl?1:0);if(c===0||c===15)continue;
  const T=(o+x)*2,B=(o2+x)*2,L=(o+x)*2+1,R=(o+x+1)*2+1;
  switch(c){case 1:seg(L,B);break;case 2:seg(B,R);break;case 3:seg(L,R);break;case 4:seg(T,R);break;
   case 5:{const m=(F[o+x]+F[o+x+1]+F[o2+x]+F[o2+x+1])/4>lev;if(m){seg(L,T);seg(B,R);}else{seg(T,R);seg(L,B);}break;}
   case 6:seg(T,B);break;case 7:seg(L,T);break;case 8:seg(L,T);break;case 9:seg(T,B);break;
   case 10:{const m=(F[o+x]+F[o+x+1]+F[o2+x]+F[o2+x+1])/4>lev;if(m){seg(T,R);seg(L,B);}else{seg(L,T);seg(B,R);}break;}
   case 11:seg(T,R);break;case 12:seg(L,R);break;case 13:seg(B,R);break;case 14:seg(L,B);break;}}}
 const ns=sa.length/2,adj=new Map();
 for(let n=0;n<ns;n++)for(const k of [sa[2*n],sa[2*n+1]]){const l=adj.get(k);if(l)l.push(n);else adj.set(k,[n]);}
 const used=new Uint8Array(ns),loops=[];
 for(let n=0;n<ns;n++){if(used[n])continue;used[n]=1;const loop=[sa[2*n],sa[2*n+1]];let cur=sa[2*n+1];
  for(;;){const l=adj.get(cur);let nx=-1;for(const m of l)if(!used[m]){nx=m;break;}if(nx<0)break;used[nx]=1;
   const o=sa[2*nx]===cur?sa[2*nx+1]:sa[2*nx];loop.push(o);cur=o;}
  if(loop[loop.length-1]===loop[0])loop.pop();loops.push(loop.map(k=>pts.get(k)));}
 return loops;}

class GW{constructor(cfg,D,title,tool,rpm){this.c=cfg;this.L=[];this.ox=cfg.origin==='center'?-D.W/2:0;this.oy=cfg.origin==='center'?-D.H/2:0;
  this.x=0;this.y=0;this.z=cfg.safe;this.f=null;this.cutLen=0;this.time=0;
  if(cfg.cm)this.L.push('('+title+')','(Tool: '+tool+')','(Part '+fmt(D.W)+' x '+fmt(D.H)+' mm, thickness '+fmt(D.T)+' mm)','(Z0 = top surface, XY0 = '+(cfg.origin==='center'?'center':'bottom-left corner')+')','(Made with Noksha CNC)');
  this.L.push('G21','G90','G17','G0 Z'+fmt(cfg.safe));if(cfg.m3)this.L.push('M3 S'+Math.round(rpm));}
 rz(z){if(this.z===z)return;this.time+=Math.abs(z-this.z)/3000;this.L.push('G0 Z'+fmt(z));this.z=z;}
 rxy(x,y){const X=x+this.ox,Y=y+this.oy;if(fmt(X)===fmt(this.x)&&fmt(Y)===fmt(this.y))return;this.time+=Math.hypot(X-this.x,Y-this.y)/6000;this.L.push('G0 X'+fmt(X)+' Y'+fmt(Y));this.x=X;this.y=Y;}
 travel(x,y){this.rz(this.c.safe);this.rxy(x,y);}
 hop(x,y){const d=Math.hypot(x+this.ox-this.x,y+this.oy-this.y);if(d>40)this.travel(x,y);else{this.rz(Math.max(this.c.ret,this.z>this.c.ret?this.c.ret:this.c.ret));this.rxy(x,y);}}
 lin(x,y,z,f){let s='G1',nx=this.x,ny=this.y,nz=this.z;
  if(x!=null){const X=x+this.ox;if(fmt(X)!==fmt(this.x)){s+=' X'+fmt(X);nx=X;}}
  if(y!=null){const Y=y+this.oy;if(fmt(Y)!==fmt(this.y)){s+=' Y'+fmt(Y);ny=Y;}}
  if(z!=null&&fmt(z)!==fmt(this.z)){s+=' Z'+fmt(z);nz=z;}
  if(s==='G1')return;if(f!==this.f){s+=' F'+Math.round(f);this.f=f;}
  const d=Math.hypot(nx-this.x,ny-this.y,nz-this.z);this.cutLen+=d;this.time+=d/f;this.x=nx;this.y=ny;this.z=nz;this.L.push(s);}
 plunge(z,f){this.lin(null,null,z,f);}
 end(){this.rz(this.c.safe);if(this.c.m3)this.L.push('M5');this.L.push('G0 X0 Y0','M30');return this.L.join('\n')+'\n';}}
function steps(depth,pass){const n=Math.max(1,Math.ceil(depth/Math.max(0.2,pass)-1e-6));return Array.from({length:n},(_,k)=>(k+1)*depth/n);}

function opGroove(D,t,cfg){const g=new GW(cfg,D,'Border / line engraving (V-carve)',`V-bit ${t.vang} deg`,t.rpm);
 const items=D.grooves.slice();let cx=0,cy=0;const out=[];
 while(items.length){let bi=0,bd=1e18;for(let i=0;i<items.length;i++){const p=items[i].pts[0];const d=(p[0]-cx)**2+(p[1]-cy)**2;if(d<bd){bd=d;bi=i;}}const it=items.splice(bi,1)[0];out.push(it);cx=it.pts[0][0];cy=it.pts[0][1];}
 for(const it of out){const pts=it.pts,lv=steps(it.depth,t.pass);g.hop(pts[0][0],pts[0][1]);
  for(const zd of lv){g.plunge(-zd,t.plunge);for(let i=1;i<pts.length;i++)g.lin(pts[i][0],pts[i][1],null,t.feed);g.lin(pts[0][0],pts[0][1],null,t.feed);}
  g.rz(cfg.ret);}
 return g;}
function opRelief(D,t,cfg){const g=new GW(cfg,D,'Relief / carving (raster)',`Ball-nose ${t.dia} mm`,t.rpm);
 const {gw,gh,res,relief,G}=D;let maxD=0;for(let k=0;k<relief.length;k++)if(relief[k]>maxD)maxD=relief[k];
 const minD=0.04,levels=Math.max(1,Math.ceil(maxD/t.pass-1e-6)),gap=Math.max(1,Math.round(t.dia*1.5/res));
 for(let k=1;k<=levels;k++){const last=k===levels,lim=Math.min(k*t.pass,maxD),prev=(k-1)*t.pass,so=last?t.step:Math.max(t.step,t.dia*0.45),rs=Math.max(1,Math.round(so/res));let dir=1;
  for(let j=0;j<gh;j+=rs){const o=j*gw,runs=[];let a=-1;const need=Math.max(prev+0.02,minD);
   for(let i=0;i<gw;i++){if(relief[o+i]>need){if(a<0)a=i;}else if(a>=0){runs.push([a,i-1]);a=-1;}}
   if(a>=0)runs.push([a,gw-1]);if(!runs.length)continue;
   const mr=[runs[0].slice()];for(let q=1;q<runs.length;q++){const L=mr[mr.length-1];if(runs[q][0]-L[1]<=gap)L[1]=runs[q][1];else mr.push(runs[q].slice());}
   const y=G.Y(j),seq=dir>0?mr:mr.slice().reverse();
   const zAt=i=>{const d=relief[o+i];if(d<minD)return 0.3;return -Math.round(Math.min(d,lim)*100)/100;};
   for(const [ra,rb] of seq){const s=dir>0?ra:rb,e=dir>0?rb:ra,st=dir;g.hop(G.X(s),y);let pz=zAt(s);g.plunge(pz,t.plunge);let lastE=s,prevI=s;
    for(let i=s+st;st>0?i<=e:i>=e;i+=st){const z=zAt(i);if(z!==pz){if(prevI!==lastE)g.lin(G.X(prevI),y,pz,t.feed);g.lin(G.X(i),y,z,t.feed);lastE=i;pz=z;}prevI=i;}
    if(prevI!==lastE)g.lin(G.X(prevI),y,pz,t.feed);g.rz(cfg.ret);}
   dir=-dir;}}
 return g;}
function opJali(D,t,cfg,geo){const g=new GW(cfg,D,'Jali / through pockets',`Flat end mill ${t.dia} mm`,t.rpm);
 const {gw,gh,res,G}=D,Sj=geo.jaliS,r=geo.jaliR,lv=steps(D.T+cfg.over,t.pass),rs=Math.max(1,Math.round(t.step/res));
 for(const zd of lv){const z=-zd;let dir=1;
  for(let j=0;j<gh;j+=rs){const o=j*gw,runs=[];let a=-1;for(let i=0;i<gw;i++){if(Sj[o+i]>=r){if(a<0)a=i;}else if(a>=0){runs.push([a,i-1]);a=-1;}}if(a>=0)runs.push([a,gw-1]);
   const y=G.Y(j),seq=dir>0?runs:runs.slice().reverse();
   for(const [ra,rb] of seq){const s=dir>0?ra:rb,e=dir>0?rb:ra;g.hop(G.X(s),y);g.plunge(z,t.plunge);g.lin(G.X(e),y,null,t.feed);g.rz(cfg.ret);}
   if(runs.length)dir=-dir;}
  for(const L of geo.jaliLoops){g.hop(L[0][0],L[0][1]);g.plunge(z,t.plunge);for(let i=1;i<L.length;i++)g.lin(L[i][0],L[i][1],null,t.feed);g.lin(L[0][0],L[0][1],null,t.feed);g.rz(cfg.ret);}}
 return g;}
function opDrill(D,t,cfg){const g=new GW(cfg,D,'Drill holes',`Bit ${t.dia} mm`,t.rpm),depth=D.T+cfg.over;
 for(const h of D.drills){if(h.d<=t.dia+0.25){g.travel(h.x,h.y);g.rz(1);let z=0;while(z<depth-1e-6){z=Math.min(depth,z+t.pass);g.plunge(-z,t.plunge);g.rz(1);}g.rz(cfg.safe);}
  else{const R=(h.d-t.dia)/2;g.travel(h.x+R,h.y);for(const zd of steps(depth,t.pass)){g.plunge(-zd,t.plunge);for(let a=1;a<=48;a++){const an=a/48*2*Math.PI;g.lin(h.x+R*Math.cos(an),h.y+R*Math.sin(an),null,t.feed);}}g.rz(cfg.safe);}}
 return g;}
function opCut(D,t,cfg,geo){const g=new GW(cfg,D,'Profile cut-out',`Flat end mill ${t.dia} mm`,t.rpm);
 const depth=D.T+cfg.over,lv=steps(depth,t.pass),tabs=D.cut.tabs|0,tabTop=-(D.T-Math.min(D.cut.tabH,D.T-1));
 const loops=geo.cut.slice().sort((a,b)=>Math.abs(area(a))-Math.abs(area(b)));
 for(const L of loops){const cl=[...L,L[0]],per=perim(cl,false),useT=tabs>0&&per>tabs*(D.cut.tabW+t.dia)*2.5;g.travel(L[0][0],L[0][1]);
  const half=(D.cut.tabW+t.dia)/2,cent=[];for(let k=0;k<tabs;k++)cent.push(per*(k+0.5)/tabs);const inTab=s=>cent.some(c=>Math.abs(s-c)<half);
  for(const zd of lv){const z=-zd;
   if(!(useT&&z<tabTop)){g.plunge(z,t.plunge);for(let i=1;i<cl.length;i++)g.lin(cl[i][0],cl[i][1],null,t.feed);}
   else{g.plunge(z,t.plunge);let s=0;for(let q=1;q<cl.length;q++){const A=cl[q-1],B=cl[q],L2=Math.hypot(B[0]-A[0],B[1]-A[1]),n=Math.max(1,Math.ceil(L2/1.5));
     for(let m=1;m<=n;m++){const f=m/n,ss=s+L2*f,zz=inTab(ss)?tabTop:z;g.lin(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,zz,zz<g.z?t.plunge:t.feed);}s+=L2;}}}
  g.rz(cfg.safe);}
 return g;}


function grooveField(D,vang){const F=new Float32Array(D.gw*D.gh);const tn=Math.tan((vang||90)*Math.PI/360),G=D.G,res=D.res;
 for(const g of D.grooves){const d=g.depth,rp=d*tn/res+1,pts=g.pts,n=pts.length;
  for(let s=0;s<n;s++){const A=pts[s],B=pts[(s+1)%n];if(!g.closed&&s===n-1)break;
   const ai=G.I(A[0]),aj=G.J(A[1]),bi=G.I(B[0]),bj=G.J(B[1]);
   const i0=Math.max(0,Math.floor(Math.min(ai,bi)-rp)),i1=Math.min(D.gw-1,Math.ceil(Math.max(ai,bi)+rp)),j0=Math.max(0,Math.floor(Math.min(aj,bj)-rp)),j1=Math.min(D.gh-1,Math.ceil(Math.max(aj,bj)+rp));
   const dx=bi-ai,dy=bj-aj,L2=dx*dx+dy*dy||1e-9;
   for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){let t=((i-ai)*dx+(j-aj)*dy)/L2;t=clamp(t,0,1);const ex=ai+t*dx-i,ey=aj+t*dy-j,dist=Math.sqrt(ex*ex+ey*ey)*res,dep=d-dist/tn;const k=j*D.gw+i;if(dep>F[k])F[k]=dep;}}}
 return F;}
function imToCanvas(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').putImageData(im,0,0);return c;}
function pointAt(cl,s){let acc=0;for(let i=1;i<cl.length;i++){const A=cl[i-1],B=cl[i],L=Math.hypot(B[0]-A[0],B[1]-A[1]);if(acc+L>=s){const f=(s-acc)/(L||1);return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f];}acc+=L;}return cl[cl.length-1];}
function drawDrawing(ctx,D,geo,k,X,Y,dpr){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);

 const path=(p,col,w,closed=true,dash)=>{ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));if(closed)ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=w*dpr;ctx.setLineDash(dash?dash.map(v=>v*dpr):[]);ctx.stroke();};
 // relief outlines (motif drawn as lines)
 const lv=[0.3,Math.max(0.6,maxOf(D.relief)*0.55)];
 for(const l of lv)for(const p of loopsAt(D.G,D.relief,l,eps,1))path(p,'#555',0.8);
 for(const g of D.grooves)path(g.pts,'#111',1.1);
 if(anyOf(D.jali))for(const p of loopsAt(D.G,signedDist(D.jali,D.gw,D.gh),0,eps,0.5)){ctx.fillStyle='#d9d9d9';ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();ctx.fill();path(p,'#111',1.1);}
 for(const p of loopsAt(D.G,D.S,0,eps,10))path(p,'#000',2.2);
 D.drills.forEach(h=>{const r=Math.max(2.5*dpr,h.d/2*k);ctx.beginPath();ctx.arc(X(h.x),Y(h.y),r,0,7);ctx.strokeStyle='#000';ctx.lineWidth=1.2*dpr;ctx.setLineDash([]);ctx.stroke();ctx.beginPath();ctx.moveTo(X(h.x)-r*1.8,Y(h.y));ctx.lineTo(X(h.x)+r*1.8,Y(h.y));ctx.moveTo(X(h.x),Y(h.y)-r*1.8);ctx.lineTo(X(h.x),Y(h.y)+r*1.8);ctx.lineWidth=0.6*dpr;ctx.stroke();});
 // dimensions
 ctx.setLineDash([]);ctx.strokeStyle='#b0401a';ctx.fillStyle='#b0401a';ctx.lineWidth=1*dpr;const fs=Math.max(10,Math.min(15,D.M*k/dpr*0.42))*dpr;ctx.font=`600 ${fs}px Hind Siliguri,sans-serif`;
 const off=D.M*0.45;const arrow=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1),s=6*dpr;for(const [px,py,aa] of [[x1,y1,a],[x2,y2,a+Math.PI]]){ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+s*Math.cos(aa+0.4),py+s*Math.sin(aa+0.4));ctx.lineTo(px+s*Math.cos(aa-0.4),py+s*Math.sin(aa-0.4));ctx.closePath();ctx.fill();}};
 arrow(X(0),Y(-off),X(D.W),Y(-off));ctx.textAlign='center';ctx.fillStyle='#fff';const tW=fmtU(D.W);const mw=ctx.measureText(tW).width+8*dpr;ctx.fillRect(X(D.W/2)-mw/2,Y(-off)-fs*0.7,mw,fs*1.3);ctx.fillStyle='#b0401a';ctx.fillText(tW,X(D.W/2),Y(-off)+fs*0.35);
 arrow(X(-off),Y(0),X(-off),Y(D.H));ctx.save();ctx.translate(X(-off),Y(D.H/2));ctx.rotate(-Math.PI/2);const tH=fmtU(D.H);const mh=ctx.measureText(tH).width+8*dpr;ctx.fillStyle='#fff';ctx.fillRect(-mh/2,-fs*0.7,mh,fs*1.3);ctx.fillStyle='#b0401a';ctx.fillText(tH,0,fs*0.35);ctx.restore();
 if(D.inner&&MODE==='design'){const [x0,y0,x1,y1]=D.inner;ctx.font=`${fs*0.8}px Hind Siliguri,sans-serif`;ctx.fillStyle='#777';ctx.textAlign='left';}
 ctx.font=`${fs*0.85}px Hind Siliguri,sans-serif`;ctx.textAlign='left';ctx.fillStyle='#444';
 const name=MODE==='design'?(PARTS[P.part]?.n||'প্যানেল'):'ছবির নকশা';ctx.fillText(name+' · পুরুত্ব '+fmtU(D.T,UNIT==='mm'?0:2),6*dpr,fs*1.1);}
function maxOf(a){let m=0;for(let i=0;i<a.length;i++)if(a[i]>m)m=a[i];return m;}
function designOutlines(){const G=LASTGEN,D=G.D,eps=0.05;const out={shape:loopsAt(D.G,D.S,0,eps,10),jali:anyOf(D.jali)?loopsAt(D.G,signedDist(D.jali,D.gw,D.gh),0,eps,0.5):[],relief:[]};
 if(maxOf(D.relief)>0.05)out.relief=loopsAt(D.G,D.relief,0.3,eps,2);return out;}
function makeSVG(){const G=LASTGEN,D=G.D,O=designOutlines();const W=D.W,H=D.H;
 const pth=(p)=>'M'+p.map(q=>fmt(q[0])+' '+fmt(H-q[1])).join(' L')+' Z';
 let s=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${fmt(W)}mm" height="${fmt(H)}mm" viewBox="0 0 ${fmt(W)} ${fmt(H)}">\n`;
 s+=`<g id="OUTLINE" fill="none" stroke="#d0281c" stroke-width="0.4">${O.shape.map(p=>`<path d="${pth(p)}"/>`).join('')}</g>\n`;
 s+=`<g id="LINES_VCARVE" fill="none" stroke="#1d4fa3" stroke-width="0.3">${D.grooves.map(g=>`<path d="${pth(g.pts)}"/>`).join('')}</g>\n`;
 s+=`<g id="RELIEF_AREA" fill="none" stroke="#e08a1c" stroke-width="0.25">${O.relief.map(p=>`<path d="${pth(p)}"/>`).join('')}</g>\n`;
 s+=`<g id="JALI" fill="none" stroke="#1f8a4c" stroke-width="0.3">${O.jali.map(p=>`<path d="${pth(p)}"/>`).join('')}</g>\n`;
 s+=`<g id="DRILL" fill="none" stroke="#7a2ea0" stroke-width="0.3">${D.drills.map(h=>`<circle cx="${fmt(h.x)}" cy="${fmt(H-h.y)}" r="${fmt(h.d/2)}"/>`).join('')}</g>\n</svg>\n`;return s;}
function makeDXF(){const G=LASTGEN,D=G.D,O=designOutlines();const L=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','9','$INSUNITS','70','4','0','ENDSEC','0','SECTION','2','ENTITIES'];
 const poly=(p,layer)=>{L.push('0','POLYLINE','8',layer,'66','1','70','1','10','0','20','0','30','0');for(const q of p)L.push('0','VERTEX','8',layer,'10',fmt(q[0]),'20',fmt(q[1]),'30','0');L.push('0','SEQEND','8',layer);};
 O.shape.forEach(p=>poly(p,'OUTLINE'));D.grooves.forEach(g=>poly(g.pts,'LINES_VCARVE'));O.relief.forEach(p=>poly(p,'RELIEF_AREA'));O.jali.forEach(p=>poly(p,'JALI'));
 D.drills.forEach(h=>L.push('0','CIRCLE','8','DRILL','10',fmt(h.x),'20',fmt(h.y),'30','0','40',fmt(h.d/2)));
 L.push('0','ENDSEC','0','EOF');return L.join('\r\n')+'\r\n';}
function heightmapCanvas(){const G=LASTGEN,D=G.D;const i0=Math.max(0,Math.round(D.G.I(0))),i1=Math.min(D.gw-1,Math.round(D.G.I(D.W))),j0=Math.max(0,Math.round(D.G.J(D.H))),j1=Math.min(D.gh-1,Math.round(D.G.J(0)));
 const w=i1-i0+1,h=j1-j0+1,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h);
 let md=0.1;for(let k=0;k<D.relief.length;k++){const d=Math.max(D.relief[k],G.gF[k]);if(d>md)md=d;}if(anyOf(D.jali))md=Math.max(md,D.T);
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const k=(j+j0)*D.gw+i+i0;let v;if(!D.shape[k])v=255;else if(D.jali[k])v=0;else v=255*(1-Math.max(D.relief[k],G.gF[k])/md);const o=4*(j*w+i);im.data[o]=im.data[o+1]=im.data[o+2]=Math.round(v);im.data[o+3]=255;}
 x.putImageData(im,0,0);c._maxDepth=md;return c;}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/png'));}
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function deflate(u8){if(typeof CompressionStream==='undefined')return null;try{const cs=new CompressionStream('deflate-raw');const s=new Blob([u8]).stream().pipeThrough(cs);return new Uint8Array(await new Response(s).arrayBuffer());}catch(e){return null;}}
async function makeZip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;const d=new Date();
 const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
 for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);let comp=await deflate(data),method=8;if(!comp||comp.length>=data.length){comp=data;method=0;}

  parts.push(new Uint8Array(h.buffer),name,comp);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,method,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,comp.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+comp.length;}

 q.archH*=sy;q.bArchH*=sy;q.radius*=s;q.bInset*=sb;q.bGap*=clamp(s,0.75,1.4);q.bevStart*=sb;q.bevWidth*=sb;
 if(q.motif==='vine'){q.mW*=sx;q.mH*=clamp(s,0.6,1.8);}else{q.mW*=s;q.mH*=s;}
 q.cS*=s;q.jCell*=clamp(s,0.75,1.5);q.jMargin*=sb;q.hY*=sy;return q;}
function applyDims(W,H,T){const q=scaleParams(BASE,W/BASE.W,H/BASE.H);q.W=W;q.H=H;q.T=T;if(q.part==='drawer')q.hY=H/2;P=q;DIMS[P.part]={W,H,T};store.set('dims',DIMS);saveLast();schedule();}
function setPartFresh(fk,pk,over){P=Object.assign({},DEF,PARTS[pk].p,over||{},{furn:fk,part:pk});BASE=Object.assign({},P);const d=DIMS[pk];if(d)applyDims(d.W,d.H,d.T);else{saveLast();schedule();}}

/* ===================== REALISTIC WOOD RENDER ===================== */
function renderWood(D,gF,o={}){const {gw,gh,res,G}=D,N=gw*gh;const Sj=anyOf(D.jali)?signedDist(D.jali,gw,gh):null;
 const re=clamp(D.T*0.1,1,3),z=new Float32Array(N),solid=new Uint8Array(N);let maxd=0.5;
 for(let k=0;k<N;k++){if(D.shape[k]&&!D.jali[k]){solid[k]=1;let d=D.relief[k];if(gF&&gF[k]>d)d=gF[k];if(d>maxd)maxd=d;let e=D.S[k]*res;if(Sj){const ej=-Sj[k]*res;if(ej<e)e=ej;}let zz=-d;if(e<re){const t=1-Math.max(0,e)/re;zz-=t*t*re*0.9;}z[k]=zz;}else z[k]=-D.T*1.2;}
 const zb=blurArr(z,gw,gh,Math.max(1,Math.round(3/res)));
 const sm=new Float32Array(N);for(let k=0;k<N;k++)sm[k]=solid[k];const smb=blurArr(sm,gw,gh,Math.max(1,Math.round(Math.max(3,D.T*0.4)/res)));
 const ox=Math.max(1,Math.round(D.T*0.3/res)),oy=Math.max(1,Math.round(D.T*0.42/res));
 let i0=0,i1=gw-1,j0=0,j1=gh-1;if(o.crop){const [a,b,c,d]=o.crop;i0=clamp(Math.floor(G.I(a)),0,gw-1);i1=clamp(Math.ceil(G.I(c)),0,gw-1);j0=clamp(Math.floor(G.J(d)),0,gh-1);j1=clamp(Math.ceil(G.J(b)),0,gh-1);}
 const w=i1-i0+1,h=j1-j0+1,im=new ImageData(w,h),px=im.data;const vert=D.H>=D.W;
 const L1=[-0.48,0.55,0.68],L2=[0.55,-0.25,0.8],Hh=(()=>{const a=[L1[0],L1[1],L1[2]+1],l=Math.hypot(...a);return a.map(v=>v/l);})();
 const dark=o.wood==='dark'?[110,62,32]:[156,98,52],light=o.wood==='dark'?[170,104,58]:[220,166,108];
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const k=j*gw+i,p4=4*((j-j0)*w+(i-i0));
  if(!solid[k]){const t=(j-j0)/h;let r=239-18*t,g=231-21*t,b=219-23*t;const si=i-ox,sj=j-oy;let sh=0;if(si>=0&&sj>=0)sh=smb[sj*gw+si];const f=1-0.42*sh;px[p4]=r*f;px[p4+1]=g*f;px[p4+2]=b*f;px[p4+3]=255;continue;}
  const zc=z[k],gz=q=>solid[q]?z[q]:zc-0.6;
  const zl=i>0?gz(k-1):zc,zr=i<gw-1?gz(k+1):zc,zu=j>0?gz(k-gw):zc,zd=j<gh-1?gz(k+gw):zc;
  const ex=o.ex||1.4;let nx=clamp(-(zr-zl)/(2*res)*ex,-5,5),ny=clamp(-(zu-zd)/(2*res)*ex,-5,5);const nl=Math.sqrt(nx*nx+ny*ny+1);nx/=nl;ny/=nl;const nz=1/nl;
  const d1=Math.max(0,nx*L1[0]+ny*L1[1]+nz*L1[2]),d2=Math.max(0,nx*L2[0]+ny*L2[1]+nz*L2[2]),sp=Math.pow(Math.max(0,nx*Hh[0]+ny*Hh[1]+nz*Hh[2]),36)*0.22;
  const ao=clamp(1-Math.max(0,zb[k]-zc)*0.28,0.45,1);
  const x=G.X(i),y=G.Y(j),a=vert?y:x,b=vert?x:y;
  const w1=Math.sin((b+3*Math.sin(a*0.008)+1.5*Math.sin(a*0.021+b*0.011))*0.9),w2=Math.sin(b*3.1+Math.sin(a*0.07)*3)*0.5+Math.sin(b*7.3+a*0.01)*0.25;
  let t=0.55+0.11*w1+0.05*w2;if(-zc>0.4)t+=0.05;
  const L=(0.2+0.88*d1+0.16*d2)*ao*(1-0.28*Math.min(1,-zc/maxd));
  for(let c=0;c<3;c++)px[p4+c]=clamp((dark[c]+(light[c]-dark[c])*t)*L+sp*255,0,255);px[p4+3]=255;}
 return imToCanvas(im);}
function blurArr(a,w,h,r){if(r<1)return a;let src=a;for(let pass=0;pass<2;pass++){const t=new Float32Array(w*h),o=new Float32Array(w*h),n=2*r+1;
 for(let y=0;y<h;y++){const of=y*w;let s=0;for(let x=-r;x<=r;x++)s+=src[of+clamp(x,0,w-1)];for(let x=0;x<w;x++){t[of+x]=s/n;s+=src[of+Math.min(w-1,x+r+1)]-src[of+Math.max(0,x-r)];}}
 for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[clamp(y,0,h-1)*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x];}}
 src=o;}return src;}

function previewRes(target){const W=MODE==='image'?Q.W:P.W,H=MODE==='image'?Q.H:P.H;return Math.max(0.3,Math.max(W,H)/(target||(window.innerWidth<700?520:700)));}

function buildCur(res,margin){margin=margin??autoMargin();return MODE==='image'?buildImage(Q,res,margin):buildPart(P,res,margin);}
function autoMargin(){const W=MODE==='image'?Q.W:P.W,H=MODE==='image'?Q.H:P.H;return Math.max(TOOLS.c.dia+8,Math.max(W,H)*0.07);}
function makePV(res){const D=buildCur(res);const geo=tpGeom(D,TOOLS);const gF=grooveField(D,TOOLS.g.vang);return {D,geo,gF,wood:null};}
function renderPreview(){$('pvBusy').textContent='';if(MODE==='image'&&!IIMG){LASTPV=null;drawPlaceholder($('pv'));return;}
 try{LASTPV=makePV(previewRes());}catch(e){console.error(e);return;}
 const b=$('pvBox');drawInto($('pv'),LASTPV,b.clientWidth-4,b.clientHeight-4,VIEW);
 $('pvDim').textContent=fmtU(LASTPV.D.W)+' × '+fmtU(LASTPV.D.H);
 const W=warnings(LASTPV.D,LASTPV.geo).filter(x=>x[0]==='warn');const wl=$('warnLine');wl.classList.toggle('hidden',!W.length);if(W.length)wl.textContent='⚠️ '+W[0][1]+(W.length>1?' (+'+bn(W.length-1)+')':'');
 if(ROUTE.st&&FLOWS[ROUTE.s]&&FLOWS[ROUTE.s].steps[ROUTE.st-1].r===stMake)renderMakeInfo();}
function drawPlaceholder(cv){cv.width=600;cv.height=300;cv.style.width='300px';cv.style.height='150px';const x=cv.getContext('2d');x.fillStyle='#7b6655';x.font='28px Hind Siliguri,sans-serif';x.textAlign='center';x.fillText('ছবি দিলে এখানে দেখাবে',300,160);$('pvDim').textContent='';}
function drawInto(cv,pv,maxW,maxH,view){const D=pv.D,tw=D.W+2*D.M,th=D.H+2*D.M,sc=Math.max(0.01,Math.min(maxW/tw,maxH/th)),dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.max(10,Math.round(tw*sc*dpr));cv.height=Math.max(10,Math.round(th*sc*dpr));cv.style.width=Math.round(tw*sc)+'px';cv.style.height=Math.round(th*sc)+'px';
 const ctx=cv.getContext('2d'),k=sc*dpr,X=x=>(x+D.M)*k,Y=y=>(D.H+D.M-y)*k;
 cv.classList.toggle('tilt',view==='tilt');cv.parentElement.classList.toggle('paper',view==='draw'||view==='path');if(cv.id==='pv')$('pvLegend').classList.toggle('hidden',view!=='path');
 if(view==='draw'){drawDrawing(ctx,D,pv.geo,k,X,Y,dpr);return;}
 if(!pv.wood)pv.wood=renderWood(D,pv.gF);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 if(view!=='path'){ctx.drawImage(pv.wood,0,0,cv.width,cv.height);return;}
 ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.globalAlpha=0.3;ctx.drawImage(pv.wood,0,0,cv.width,cv.height);ctx.globalAlpha=1;
 const rm=document.createElement('canvas');rm.width=D.gw;rm.height=D.gh;const rx=rm.getContext('2d'),ri=rx.createImageData(D.gw,D.gh);
 for(let q=0;q<D.relief.length;q++)if(D.relief[q]>0.05){ri.data[4*q]=240;ri.data[4*q+1]=140;ri.data[4*q+2]=20;ri.data[4*q+3]=90;}
 rx.putImageData(ri,0,0);ctx.drawImage(rm,0,0,cv.width,cv.height);
 const path=(p,col,w,dash)=>{ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=w*dpr;ctx.setLineDash(dash?dash.map(v=>v*dpr):[]);ctx.stroke();};
 D.grooves.forEach(g=>path(g.pts,'#1d4fa3',1.3));pv.geo.jaliLoops.forEach(p=>path(p,'#1f8a4c',1.3));pv.geo.cut.forEach(p=>path(p,'#d0281c',1.7,[6,4]));
 if(D.cut.on&&D.cut.tabs>0)pv.geo.cut.forEach(L=>{const cl=[...L,L[0]],per=perim(cl,false);for(let t=0;t<D.cut.tabs;t++){const pt=pointAt(cl,per*(t+0.5)/D.cut.tabs);ctx.fillStyle='#f0a020';ctx.fillRect(X(pt[0])-4*dpr,Y(pt[1])-4*dpr,8*dpr,8*dpr);}});
 ctx.setLineDash([]);D.drills.forEach(h=>{ctx.beginPath();ctx.arc(X(h.x),Y(h.y),Math.max(3*dpr,h.d/2*k),0,7);ctx.strokeStyle='#7a2ea0';ctx.lineWidth=2*dpr;ctx.stroke();});}

/* ===================== WARNINGS ===================== */
function warnings(D,geo){const L=[],add=(c,t)=>L.push([c,t]);const maxR=maxOf(D.relief);
 if(MODE==='image'){if(IIMG){if(/jpe?g/i.test(IIMG.type)&&Q.mode!=='relief')add('tip','JPG-তে কিনারা ঝাপসা হয়। PNG দিলে বা “মসৃণ” ১–২ করলে ভালো হবে।');
   if(Math.max(IIMG.ow,IIMG.oh)<800)add('warn','ছবিটা ছোট ('+IIMG.ow+'×'+IIMG.oh+')। বড় মাপে খাঁজ খাঁজ দেখাবে, ১৫০০+ পিক্সেলের ছবি দিন।');
   if(Q.mode==='relief'&&IIMG.mid>0.55&&IIMG.colorful>0.08)add('warn','সাধারণ ফটো থেকে ভালো রিলিফ হয় না। ডেপথ-ম্যাপ (সাদা=উঁচু, কালো=নিচু) ছবি দিন।');
   if(Q.mode!=='relief'&&IIMG.mid>0.35)add('tip','ছবিতে ধূসর অংশ বেশি। “সাদা-কালো সীমা” স্লাইডার ঠিক করুন।');}}
 else{if((P.motif==='image'||P.corner==='image')&&!DIMG)add('warn','“নিজের ছবি” বাছাই করা, কিন্তু ছবি দেওয়া হয়নি।');
  if(!D.inner&&(P.motif!=='none'||P.corner!=='none'))add('warn','নকশা বসানোর জায়গা নেই। বর্ডার কমান বা মাপ বাড়ান।');
  if(P.jali!=='none'&&P.jali!=='full'){const hole=JALI_HOLE[P.jali]*P.jCell;if(hole<TOOLS.j.dia*1.25)add('warn','জালির ছিদ্র (~'+Math.round(hole)+' মিমি) বিটের ('+TOOLS.j.dia+' মিমি) তুলনায় ছোট। ঘর বড় করুন বা ছোট বিট নিন।');
   const bar=P.jCell*(1-Math.min(0.75,JALI_HOLE[P.jali]));if(bar<5)add('warn','জালির মাঝের কাঠ খুব সরু (~'+bar.toFixed(1)+' মিমি), ভাঙতে পারে।');}
  if(P.jali!=='none'&&geo.jaliLoops.length===0)add('warn','এই বিট দিয়ে জালির কোনো অংশ কাটা যাবে না।');
  if(P.handles>0&&(P.hY>P.H||P.hY<0))add('warn','হ্যান্ডেলের ছিদ্র বোর্ডের বাইরে চলে গেছে।');}
 if(maxR>D.T-3)add('warn','খোদাইয়ের গভীরতা ('+maxR.toFixed(1)+' মিমি) বোর্ডের পুরুত্বের খুব কাছে।');
 if(maxR>0.05&&TOOLS.r.step>TOOLS.r.dia*0.25)add('tip','রিলিফের স্টেপওভার বেশি, ফিনিশ খসখসে হবে। বিটের ব্যাসের ১০–২০% রাখুন।');
 if(D.cut.on){if(TOOLS.c.pass>TOOLS.c.dia)add('warn','কাটিংয়ে প্রতি পাসের গভীরতা বিটের ব্যাসের চেয়ে বেশি।');if((D.cut.tabs|0)===0)add('tip','ট্যাব নেই, তাই শেষ পাসে টুকরো নড়ে যেতে পারে।');}
 return L;}

/* STL (3D relief) → heightmap image */
async function loadSTL(file){const buf=await file.arrayBuffer(),dv=new DataView(buf);let tris;
 const n=buf.byteLength>=84?dv.getUint32(80,true):0;
 if(buf.byteLength===84+n*50&&n>0){tris=new Float32Array(n*9);for(let i=0;i<n;i++){const o=84+i*50+12;for(let k=0;k<9;k++)tris[i*9+k]=dv.getFloat32(o+k*4,true);}}
 else{const txt=new TextDecoder().decode(buf);const re=/vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g;const a=[];let m;while((m=re.exec(txt)))a.push(+m[1],+m[2],+m[3]);if(a.length<9)throw new Error('STL ফাইলটা পড়া যায়নি');tris=new Float32Array(a.slice(0,a.length-a.length%9));}
 let x0=1e30,x1=-1e30,y0=1e30,y1=-1e30,z0=1e30,z1=-1e30;for(let i=0;i<tris.length;i+=3){const x=tris[i],y=tris[i+1],z=tris[i+2];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;if(z<z0)z0=z;if(z>z1)z1=z;}
 const SW=x1-x0,SH=y1-y0,zr=z1-z0;if(!(SW>0&&SH>0&&zr>0))throw new Error('STL-এ উঁচু-নিচু কিছু পাওয়া যায়নি');
 const sc=1600/Math.max(SW,SH),w=Math.max(2,Math.round(SW*sc)),h=Math.max(2,Math.round(SH*sc)),zb=new Float32Array(w*h).fill(-1e30);
 for(let t=0;t<tris.length;t+=9){const ax=(tris[t]-x0)*sc,ay=(y1-tris[t+1])*sc,az=tris[t+2],bx=(tris[t+3]-x0)*sc,by=(y1-tris[t+4])*sc,bz=tris[t+5],cx=(tris[t+6]-x0)*sc,cy=(y1-tris[t+7])*sc,cz=tris[t+8];
  const d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(d)<1e-12)continue;
  const i0=Math.max(0,Math.floor(Math.min(ax,bx,cx))),i1=Math.min(w-1,Math.ceil(Math.max(ax,bx,cx))),j0=Math.max(0,Math.floor(Math.min(ay,by,cy))),j1=Math.min(h-1,Math.ceil(Math.max(ay,by,cy)));
  for(let j=j0;j<=j1;j++){const py=j+0.5;for(let i=i0;i<=i1;i++){const px=i+0.5;const l1=((by-cy)*(px-cx)+(cx-bx)*(py-cy))/d,l2=((cy-ay)*(px-cx)+(ax-cx)*(py-cy))/d,l3=1-l1-l2;
   if(l1<-1e-4||l2<-1e-4||l3<-1e-4)continue;const z=l1*az+l2*bz+l3*cz,k=j*w+i;if(z>zb[k])zb[k]=z;}}}
 const lum=new Float32Array(w*h);for(let k=0;k<w*h;k++)lum[k]=zb[k]<-1e29?1:(zb[k]-z0)/zr;
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h);for(let k=0;k<w*h;k++){const v=lum[k]*255;im.data[4*k]=im.data[4*k+1]=im.data[4*k+2]=v;im.data[4*k+3]=255;}x.putImageData(im,0,0);
 return {w,h,lum,name:file.name,type:'stl',ow:w,oh:h,colorful:0,mid:0,url:c.toDataURL('image/png'),cache:{},stl:{W:SW,H:SH,zr}};}
